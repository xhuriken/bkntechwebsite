name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          if [ -z "$SSHPASS" ]; then
            echo "::error::Secret VPS_PASSWORD is not set in GitHub Repository Secrets!"
            exit 1
          fi

          echo "Connecting via SSH to ${VPS_USER}@${VPS_HOST}:${VPS_PORT}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "mkdir -p $REMOTE_PATH"

          sshpass -e rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $VPS_PORT" \
            ./ "${VPS_USER}@${VPS_HOST}:$REMOTE_PATH/"

      - name: Update .env.production and Restart Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          if [ -z "$SSHPASS" ]; then
            echo "::error::Secret VPS_PASSWORD is not set in GitHub Repository Secrets!"
            exit 1
          fi

          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "
            set -e
            cd $REMOTE_PATH

            {
              echo \"SMTP_HOST=ssl0.ovh.net\"
              echo \"SMTP_PORT=465\"
              echo \"SMTP_SECURE=true\"
              echo \"SMTP_USER=contact@bkntech.fr\"
              echo \"SMTP_PASS=\${SMTP_PASS}\"
              echo \"SMTP_TO=contact@bkntech.fr\"
              echo \"ADMIN_PASSWORD=\${ADMIN_PASSWORD}\"
              echo \"DISCORD_WEBHOOK_URL=\${DISCORD_WEBHOOK_URL}\"
            } > .env

            echo 'Rebuilding Docker containers...'
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
          "
