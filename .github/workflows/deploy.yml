name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # Empreinte du VPS épinglée : SSH refuse tout serveur qui ne présente pas CETTE clé.
      # Sans cela, une connexion interceptée recevrait les secrets envoyés plus bas (.env).
      # HostKeyAlias : la vérification ne dépend pas de l'écriture de VPS_HOST (IP ou nom).
      - name: Pin VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "::error::Secret VPS_KNOWN_HOSTS manquant"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts_vps
          printf '%s\n' 'Host *' '  StrictHostKeyChecking yes' '  UserKnownHostsFile ~/.ssh/known_hosts_vps' '  HostKeyAlias bkntech-vps' >> ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts_vps ~/.ssh/config

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "mkdir -p $REMOTE_PATH"

          # Preserve runtime content and files created on the VPS.
          rsync -avz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='dist-ssr' \
            --exclude='/api/posts.json' \
            --exclude='/api/settings.json' \
            --exclude='/api/data/' \
            --exclude='/public/uploads/' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            -e "ssh -p $VPS_PORT" \
            ./ "${VPS_USER}@${VPS_HOST}:$REMOTE_PATH/"

      - name: Update .env.production and Restart Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          PROMO_API_KEY_HASH: ${{ secrets.PROMO_API_KEY_HASH }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          # 1. Écrire le fichier .env sur le runner avec les variables secrètes
          {
            echo "SMTP_HOST=ssl0.ovh.net"
            echo "SMTP_PORT=465"
            echo "SMTP_SECURE=true"
            echo "SMTP_USER=contact@bkntech.fr"
            echo "SMTP_PASS=$SMTP_PASS"
            echo "SMTP_TO=contact@bkntech.fr"
            echo "ADMIN_PASSWORD_HASH=$ADMIN_PASSWORD_HASH"
            echo "DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "PROMO_API_KEY_HASH=$PROMO_API_KEY_HASH"
          } > /tmp/bkntech.env

          # 2. Transférer vers .env et .env.production sur le VPS
          cat /tmp/bkntech.env | ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "cat > ${REMOTE_PATH}/.env.production && cp ${REMOTE_PATH}/.env.production ${REMOTE_PATH}/.env"

          # 3. Rebuild et restart des conteneurs
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "
            set -e
            cd $REMOTE_PATH
            echo 'Rebuilding Docker containers...'
            docker compose build --no-cache
            docker compose up -d
            docker compose exec -T frontend nginx -t
            docker compose ps
          "
