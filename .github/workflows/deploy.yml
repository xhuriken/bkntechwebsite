name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "mkdir -p $REMOTE_PATH"

          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no -p $VPS_PORT" \
            ./ "${VPS_USER}@${VPS_HOST}:$REMOTE_PATH/"

      - name: Update .env.production and Restart Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VPS_HOST="${VPS_HOST:-151.80.147.208}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_USER="ubuntu"
          REMOTE_PATH="/var/www/bkntech"

          # Transférer les variables d'environnement vers .env et .env.production sur le VPS
          cat <<EOF | ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "cat > ${REMOTE_PATH}/.env.production && cp ${REMOTE_PATH}/.env.production ${REMOTE_PATH}/.env"
SMTP_HOST=ssl0.ovh.net
SMTP_PORT=465
SMTP_SECURE=true
SMTP_USER=contact@bkntech.fr
SMTP_PASS=${SMTP_PASS}
SMTP_TO=contact@bkntech.fr
ADMIN_PASSWORD=${ADMIN_PASSWORD}
DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
EOF

          # Rebuild et restart des conteneurs
          ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "
            set -e
            cd $REMOTE_PATH
            echo 'Rebuilding Docker containers...'
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
          "
