server {
    listen 80;
    server_name _;
    # Traefik terminates HTTPS; relative redirects preserve the public scheme.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max pour les uploads (images et vidéos jusqu'à 100 Mo)
    client_max_body_size 100M;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/ld+json application/xml text/xml image/svg+xml;

    # Canonical paths and permanent redirects (also work without JavaScript).
    rewrite ^/(.+)/$ /$1 permanent;
    location = /game { return 301 /portfolio/section/gaming$is_args$args; }
    location = /devlog { return 301 /portfolio/section/gaming$is_args$args; }
    location = /dkp { return 301 https://dkp95.fr; }
    location = /dkp95 { return 301 https://dkp95.fr; }
    location = /dkprenovation { return 301 https://dkp95.fr; }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location ~ ^/portfolio/admin(/promo)?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri/index.html =404;
    }

    # Page d'offre B-Ledger : jamais indexée, même en-têtes que l'admin.
    location = /b-ledger/offre {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri/index.html =404;
    }

    # Pages publiques des offres et des codes : une seule coquille pour tous les liens (le format est
    # vérifié ici, la page lit le lien elle-même). Jamais indexées. Sur /code/, aucun référent :
    # le code (dans l'adresse) ne part pas vers un autre site si le client clique un lien sortant.
    location ~ ^/(offre|code)$ { return 404; } # coquilles seules : pas de page sans lien
    location ~ "^/offre/[a-z0-9-]{3,60}$" {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /offre/index.html =404;
    }
    location ~ "^/code/[A-Za-z0-9-]{4,40}$" {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;
        try_files /code/index.html =404;
    }

    # Dossier des uploads dédiés (images WebP et vidéos MP4/WebM avec streaming byte-range)
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Cache long terme pour les assets statiques et médias
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp|gif|mp4|webm|mov|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy vers le service API Node.js pour contact, uploads et posts
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;
    }

    # Every valid route has its own prerendered document. Unknown URLs are real 404s.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri/index.html $uri =404;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Sécurité : masquer la version Nginx
    server_tokens off;
}
